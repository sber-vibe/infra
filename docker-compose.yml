# Стенд «Проверка пакета документов на субсидию»: nginx → frontend (Next.js), backend (Spring Boot) и Keycloak.
# Модель Qwen3-VL работает в Ollama на отдельном ПК в локальной сети, адрес которого задаёт OLLAMA_URL.
# Запуск: docker compose up -d --build  →  http://localhost (порт задаётся HTTP_PORT)
name: subsidy

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 8080
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      STORAGE_JDBC_URL: jdbc:h2:file:/app/data/subsidy
      AI_REMOTE_URL: ${AI_REMOTE_URL:-}
      AI_REMOTE_API_KEY: ${AI_REMOTE_API_KEY:-}
      # проверка JWT от Keycloak: ключи берутся изнутри сети compose, issuer — публичный адрес из токена.
      # Пустой KEYCLOAK_JWK_SET_URI закрывает API с 503; открытый режим требует явного профиля dev.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI-http://keycloak:8080/kc/realms/subsidy/protocol/openid-connect/certs}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SUBSIDY_PUBLIC_URL:-http://localhost}/kc/realms/subsidy
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: subsidy-backend
      # AI-модуль: модель Qwen3-VL в Ollama на отдельном ПК локальной сети (облачные AI API не используются).
      # Если Ollama на этом же компьютере — http://host.docker.internal:11434
      # ключ для прямого POST /api/v1/ai/analyze (заголовок X-Api-Key), не короче 32 символов; пусто — этот маршрут отвечает 503
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-data:/app/data
    # наружу не публикуется: доступ только через nginx
    expose:
      - "8080"
    healthcheck:
      # в образе temurin нет curl — проверяем actuator через /dev/tcp
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        # rewrites Next.js на случай прямого обращения к frontend; через nginx /api идёт сразу в backend
        BACKEND_URL: http://backend:8080
        NEXT_PUBLIC_AUTO_CLASSIFY: ${NEXT_PUBLIC_AUTO_CLASSIFY:-false}
        NEXT_PUBLIC_CONFIDENCE_THRESHOLD: ${NEXT_PUBLIC_CONFIDENCE_THRESHOLD:-0.8}
        NEXT_PUBLIC_OIDC_ISSUER: ${NEXT_PUBLIC_OIDC_ISSUER:-}
        NEXT_PUBLIC_OIDC_CLIENT_ID: ${NEXT_PUBLIC_OIDC_CLIENT_ID:-}
        NEXT_PUBLIC_DEMO_LOGIN: ${NEXT_PUBLIC_DEMO_LOGIN:-false}
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Keycloak: вход специалистов (OIDC). Доступен через nginx по пути /kc,
  # realm subsidy импортируется из keycloak/realm-subsidy.json при первом запуске.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?задайте KEYCLOAK_DB_PASSWORD в .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?задайте KEYCLOAK_ADMIN_PASSWORD в .env}
      # TLS терминируется перед стендом (или его нет на localhost); адрес берётся из X-Forwarded-* от nginx
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /kc
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${SUBSIDY_PUBLIC_URL:-http://localhost}/kc
      KC_HEALTH_ENABLED: "true"
      # один узел — без кластерного кэша Infinispan
      KC_CACHE: local
      # подставляются в realm-subsidy.json при импорте
      SUBSIDY_PUBLIC_URL: ${SUBSIDY_PUBLIC_URL:-http://localhost}
      KEYCLOAK_DEMO_PASSWORD: ${KEYCLOAK_DEMO_PASSWORD:?задайте KEYCLOAK_DEMO_PASSWORD в .env}
      # письма регистрации и восстановления пароля — через SMTP Яндекса (SSL, порт 465)
      YANDEX_SMTP_HOST: ${YANDEX_SMTP_HOST:-smtp.yandex.ru}
      YANDEX_SMTP_PORT: ${YANDEX_SMTP_PORT:-465}
      YANDEX_SMTP_USER: ${YANDEX_SMTP_USER:-}
      YANDEX_SMTP_PASSWORD: ${YANDEX_SMTP_PASSWORD:-}
    volumes:
      - ./keycloak/realm-subsidy.json:/opt/keycloak/data/import/realm-subsidy.json:ro
      # тема входа и писем в стиле рабочего места
      - ./keycloak/themes/subsidy:/opt/keycloak/themes/subsidy:ro
    # сжатые копии стилей темы: в памяти, иначе после правки CSS Keycloak отдаёт старый gzip даже после перезапуска
    tmpfs:
      - /opt/keycloak/data/tmp/kc-gzip-cache:uid=1000,gid=0,mode=0770
    expose:
      - "8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # curl в образе нет; health отдаётся на management-порту 9000
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /kc/health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  keycloak-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?задайте KEYCLOAK_DB_PASSWORD в .env}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak", "-d", "keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  backend-data:
  keycloak-db:
