# Стенд «Проверка пакета документов на субсидию»: nginx → frontend (Next.js) и backend (Spring Boot).
# Запуск: docker compose up -d --build  →  http://localhost (порт задаётся HTTP_PORT)
name: subsidy

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 8080
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    # наружу не публикуется: доступ только через nginx
    expose:
      - "8080"
    healthcheck:
      # в образе temurin нет curl — проверяем actuator через /dev/tcp
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        # rewrites Next.js на случай прямого обращения к frontend; через nginx /api идёт сразу в backend
        BACKEND_URL: http://backend:8080
        NEXT_PUBLIC_AUTO_CLASSIFY: ${NEXT_PUBLIC_AUTO_CLASSIFY:-false}
        NEXT_PUBLIC_CONFIDENCE_THRESHOLD: ${NEXT_PUBLIC_CONFIDENCE_THRESHOLD:-0.8}
        NEXT_PUBLIC_OIDC_ISSUER: ${NEXT_PUBLIC_OIDC_ISSUER:-}
        NEXT_PUBLIC_OIDC_CLIENT_ID: ${NEXT_PUBLIC_OIDC_CLIENT_ID:-}
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
