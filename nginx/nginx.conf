worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile      on;
  keepalive_timeout 65;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '$request_time "$http_user_agent" upstream=$upstream_addr';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Docker DNS. Адреса задаются через переменные, поэтому nginx перечитывает их
  # и не отдаёт 502 после пересоздания контейнера backend/frontend.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    # backend принимает файл до 10 МБ, multipart чуть больше
    client_max_body_size 11m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    set $backend  http://backend:8080;
    set $frontend http://frontend:3000;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # /health — доступность backend без чувствительных данных (Д: стенд по инструкции)
    location = /health {
      proxy_pass $backend/actuator/health;
    }

    location /api/ {
      # Backend: 50 МБ на файл плюс запас для multipart.
      client_max_body_size 51m;
      # слишком большой запрос отклоняет сам nginx — отвечаем в формате API, а не HTML
      error_page 413 = @api_too_large;
      proxy_pass $backend;
      proxy_read_timeout 120s; # анализ документа моделью может идти дольше обычного запроса
      proxy_request_buffering off;
    }

    location @api_too_large {
      default_type application/problem+json;
      return 413 '{"type":"about:blank","title":"Content Too Large","status":413,"detail":"Maximum upload size exceeded"}';
    }

    # Keycloak (KC_HTTP_RELATIVE_PATH=/kc). Не /auth — там callback фронта.
    location /kc/ {
      set $keycloak http://keycloak:8080;
      proxy_pass $keycloak;
      # proxy_set_header в location отменяет заголовки уровня server — повторяем все;
      # Host с портом, иначе Keycloak строит ссылки без HTTP_PORT
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # токены и cookie Keycloak не помещаются в буфер заголовков по умолчанию
      proxy_buffer_size 128k;
      proxy_buffers 4 256k;
      proxy_busy_buffers_size 256k;
    }

    # статика Next.js с хешами в именах — кэшируется надолго
    location /_next/static/ {
      proxy_pass $frontend;
      # add_header в location отменяет заголовки уровня server — повторяем нужный
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff always;
    }

    location / {
      proxy_pass $frontend;
    }
  }
}
